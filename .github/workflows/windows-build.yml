name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build openfox.exe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release -p openfox

      - name: Stage distribution folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\openfox-windows-x64 | Out-Null
          Copy-Item target\release\openfox.exe dist\openfox-windows-x64\
          Copy-Item LICENSE.md dist\openfox-windows-x64\
          Copy-Item README.md dist\openfox-windows-x64\
          Compress-Archive -Path dist\openfox-windows-x64 -DestinationPath dist\openfox-windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfox-windows-x64
          path: dist/openfox-windows-x64.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openfox-windows-x64.zip
