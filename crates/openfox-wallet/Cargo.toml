[package]
name = "openfox-wallet"
description = "The Web3 wallet: BIP-39 keyring, BIP-32/SLIP-0010 derivation, EIP-55 and base58 addresses, per-dApp grants — no ads, no tracking, keys never leave the process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bip39 = "2"
ed25519-dalek = "2"
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
